description: "Tutor.gguf accuracy eval — Qwen2.5-Math-1.5B + RAG"

providers:
  - id: http
    label: tutor-rag
    config:
      url: http://localhost:8082/v1/complete
      method: POST
      headers:
        Content-Type: application/json
      body:
        problem: "{{problem}}"
        max_tokens: 512
        temperature: 0.1
      transformResponse: 'json.content' 

prompts:
  - "{{problem}}"

tests: test_cases_promptfoo.json

defaultTest:
  assert:
    - type: javascript
      value: '((output ?? "").replace(/\s+/g, "")).includes((context.vars.expected ?? "").replace(/\s+/g, ""))'
