name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tutor binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          NAME="tutor-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && NAME="$NAME.exe"
          go build -trimpath -ldflags "-s -w" -o "dist/$NAME" ./cmd/tutor

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  build-desktop:
    name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runs_on: ubuntu-latest }
          - { goos: darwin, goarch: amd64, runs_on: macos-latest }
          - { goos: darwin, goarch: arm64, runs_on: macos-latest }
          - { goos: windows, goarch: amd64, runs_on: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build
          NAME="tutor-desktop-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && NAME="$NAME.exe"
          $(go env GOPATH)/bin/wails build -clean -tags desktop -ldflags "-s -w" -o "dist/$NAME" -platform ${{ matrix.goos }}/${{ matrix.goarch }} || \
            go build -tags desktop -trimpath -ldflags "-s -w" -o "dist/$NAME" ./cmd/desktop
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
