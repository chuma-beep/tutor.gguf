name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tutor binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          NAME="tutor-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && NAME="$NAME.exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$NAME" ./cmd/tutor

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  desktop-linux:
    name: desktop-linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install webkit2gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails + nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build frontend
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build

      - name: Build desktop binary
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: |
          mkdir -p .tmp dist
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean -skipbindings -s \
            -tags "desktop webkit2_41" -ldflags "-s -w" -platform linux/amd64
          chmod +x build/bin/tutor-desktop
          ls -lh build/bin/

      - name: Package .deb
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          nfpm package -f packaging/nfpm.yaml -p deb \
            -t dist/tutor-desktop-linux-amd64.deb

      - name: Package .AppImage
        run: bash packaging/appimage.sh dist/tutor-desktop-linux-amd64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-amd64
          path: dist/

  desktop-darwin:
    name: desktop-darwin-universal
    runs-on: macos-latest
    env:
      # Wails appends -framework UniformTypeIdentifiers itself; pin the deployment
      # target to 11.0 so UTType is strongly linked instead of weak-linked (10.13).
      CGO_LDFLAGS: "-mmacosx-version-min=11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build frontend
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build

      - name: Build universal app
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: |
          mkdir -p .tmp dist
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Native arm64 .app bundle from Wails provides Info.plist + Resources.
          wails build -clean -skipbindings -s -tags desktop -ldflags "-s -w" -platform darwin/arm64
          APP="$(find build/bin -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "no .app"; ls -la build/bin; exit 1; }
          echo "app=$APP"
          find "$APP" -type f -exec file {} \;

          # Wails' cross-compiled amd64 slice is not a valid Mach-O on Xcode 26
          # ("archive with no architecture specification"). Build both arches
          # directly and lipo them instead.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -tags desktop -trimpath \
            -ldflags "-s -w" -o /tmp/tutor-arm64 ./cmd/desktop
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -tags desktop -trimpath \
            -ldflags "-s -w" -o /tmp/tutor-amd64 ./cmd/desktop
          file /tmp/tutor-arm64 /tmp/tutor-amd64
          lipo -create /tmp/tutor-amd64 /tmp/tutor-arm64 -output "$APP/Contents/MacOS/tutor-desktop"
          lipo -info "$APP/Contents/MacOS/tutor-desktop"

      - name: Package .dmg
        run: |
          APP="$(find build/bin -maxdepth 1 -name '*.app' | head -1)"
          hdiutil create -volname "Tutor.gguf" -srcfolder "$APP" -ov -format UDZO \
            dist/tutor-desktop-darwin-universal.dmg
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin-universal
          path: dist/

  desktop-windows:
    name: desktop-windows-amd64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          ls "/c/Program Files (x86)/NSIS" | head || true

      - name: Build frontend
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build

      - name: Build installer
        run: |
          mkdir -p dist
          export PATH="$PATH:$(go env GOPATH)/bin:/c/Program Files (x86)/NSIS"
          command -v makensis || echo "WARNING: makensis not on PATH"
          wails build -clean -skipbindings -s -nsis \
            -tags desktop -ldflags "-s -w" -platform windows/amd64
          ls -lh build/bin/ || true
          found=0
          while IFS= read -r f; do
            cp -v "$f" dist/tutor-desktop-windows-amd64-installer.exe
            found=1
          done < <(find build/bin -maxdepth 1 -iname '*installer*.exe')
          if [ "$found" -eq 0 ]; then
            echo "no NSIS installer produced by wails"; exit 1
          fi
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cli, desktop-linux, desktop-darwin, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
