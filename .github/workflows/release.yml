name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tutor binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          NAME="tutor-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && NAME="$NAME.exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$NAME" ./cmd/tutor

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  desktop-linux:
    name: desktop-linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install webkit2gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails + nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build frontend
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build

      - name: Build desktop binary
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: |
          mkdir -p .tmp dist
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean -skipbindings -s \
            -tags "desktop webkit2_41" -ldflags "-s -w" -platform linux/amd64
          chmod +x build/bin/tutor-desktop
          ls -lh build/bin/

      - name: Package .deb
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          nfpm package -f packaging/nfpm.yaml -p deb \
            -t dist/tutor-desktop-linux-amd64.deb

      - name: Package .AppImage
        run: bash packaging/appimage.sh dist/tutor-desktop-linux-amd64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-amd64
          path: dist/

  desktop-darwin:
    name: desktop-darwin-universal
    runs-on: macos-latest
    env:
      # Wails appends -framework UniformTypeIdentifiers itself; pin the deployment
      # target to 11.0 so UTType is strongly linked instead of weak-linked (10.13).
      CGO_LDFLAGS: "-mmacosx-version-min=11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build frontend
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build

      - name: Build desktop app
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: |
          mkdir -p .tmp dist
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Build each arch separately; Wails' darwin/universal lipo step fails
          # ("archive with no architecture specification") on recent Xcode.
          wails build -clean -skipbindings -s -tags desktop -ldflags "-s -w" -platform darwin/amd64
          mkdir -p build/staging/amd64
          find build/bin -maxdepth 1 -name '*.app' -exec mv {} build/staging/amd64/ \;
          ls -la build/staging/amd64

          wails build -clean -skipbindings -s -tags desktop -ldflags "-s -w" -platform darwin/arm64
          find build/bin -maxdepth 1 -name '*.app' -exec mv {} build/staging/ \;
          ls -la build/staging

      - name: Create universal .dmg
        run: |
          ARM_APP="$(find build/staging -maxdepth 1 -name '*.app' | head -1)"
          X86_APP="$(find build/staging/amd64 -maxdepth 1 -name '*.app' | head -1)"
          ARM_BIN="$(find "$ARM_APP/Contents/MacOS" -type f | head -1)"
          X86_BIN="$(find "$X86_APP/Contents/MacOS" -type f | head -1)"
          echo "arm=$ARM_BIN amd64=$X86_BIN"
          lipo -create "$X86_BIN" "$ARM_BIN" -output "$ARM_BIN.universal"
          mv "$ARM_BIN.universal" "$ARM_BIN"
          lipo -info "$ARM_BIN"
          hdiutil create -volname "Tutor.gguf" -srcfolder "$ARM_APP" -ov -format UDZO \
            dist/tutor-desktop-darwin-universal.dmg
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin-universal
          path: dist/

  desktop-windows:
    name: desktop-windows-amd64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build frontend
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build

      - name: Build installer
        run: |
          mkdir -p dist
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean -skipbindings -s -nsis \
            -tags desktop -ldflags "-s -w" -platform windows/amd64
          ls -lh build/bin/ || true
          find build/bin -maxdepth 1 -iname '*installer*.exe' \
            -exec cp -v {} dist/tutor-desktop-windows-amd64-installer.exe \;
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cli, desktop-linux, desktop-darwin, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
